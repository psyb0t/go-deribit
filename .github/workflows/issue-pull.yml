name: issue-pull

on:
  # Staggered per repo, and the job jitters on top of that: GitHub fires an
  # account's crons together, so a shared minute is a thundering herd at both
  # mirrors every six hours.
  schedule:
    - cron: "46 */6 * * *"
  workflow_dispatch:

jobs:
  issue-pull:
    permissions:
      issues: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/issue-pull.yml@master
    with:
      # Generated API clients are not mirrored to Codeberg.
      codeberg_enabled: false
      # Only the cron needs spreading out. A manual run is one repo, triggered by
      # one person who is waiting for it.
      jitter_seconds: ${{ github.event_name == 'schedule' && 600 || 0 }}
    secrets:
      gitlab_token: ${{ secrets.GITLAB_TOKEN }}
