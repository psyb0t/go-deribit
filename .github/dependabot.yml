version: 2
updates:
  # Only filters security updates for the semgrep lock; the limit of 0 keeps
  # version-update pull requests off.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # semgrep pins these exactly (mcp) or to a patch series (OpenTelemetry),
      # so a bump on its own cannot resolve. They move when requirements-
      # semgrep.txt is regenerated for a newer semgrep.
      - dependency-name: mcp
      - dependency-name: "opentelemetry-*"
